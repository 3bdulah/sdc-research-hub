name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Report dependency audit findings
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/npm-audit.json","utf8")); const vs=r.metadata?.vulnerabilities ?? {}; console.log("npm audit summary:", JSON.stringify(vs)); console.log("Affected packages:", JSON.stringify(Object.entries(r.vulnerabilities ?? {}).map(([name,v]) => ({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable})), null, 2));'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
